version: "3.8"
services:
  mysql:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: RootChangeMe123!
      MYSQL_DATABASE: eventdb
      MYSQL_USER: eventuser
      MYSQL_PASSWORD: ChangeMe123!
    ports:
      - "3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql

  tomcat-app:
    build: ./app
    ports:
      - "8080:8080"
    environment:
      DB_URL: jdbc:mysql://mysql:3306/eventdb
      DB_USER: eventuser
      DB_PASS: ChangeMe123!
    depends_on:
      - mysql

volumes:
  mysql-data:
