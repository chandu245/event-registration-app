- hosts: local
  gather_facts: false
  vars:
    ecr_repo:    "{{ ecr_repo_url }}"
    image_tag:   "{{ build_number }}"
    aws_region:  "{{ aws_region | default('ap-southeast-1') }}"
    secret_name: "{{ aws_secret_name }}"

  pre_tasks:
    - name: Ensure required variables were supplied
      assert:
        that:
          - ecr_repo_url is defined and ecr_repo_url | length > 0
          - aws_secret_name is defined and aws_secret_name | length > 0
          - eso_role_arn is defined and eso_role_arn | length > 0
        fail_msg: >
          ecr_repo_url, aws_secret_name, and eso_role_arn are required.
          They are read from Terraform outputs by the Jenkinsfile automatically.

  tasks:
    # ── Docker image ──────────────────────────────────────────────────────

    - name: Log in to ECR
      shell: >
        aws ecr get-login-password --region {{ aws_region }} |
        docker login --username AWS --password-stdin {{ ecr_repo }}

    - name: Build Docker image
      # playbook_dir resolves to an absolute path — avoids CWD ambiguity
      # with the Ansible `command` module.
      command: docker build -t {{ ecr_repo }}:{{ image_tag }} {{ playbook_dir }}/../app

    - name: Push image to ECR
      command: docker push {{ ecr_repo }}:{{ image_tag }}

    # ── External Secrets Operator ─────────────────────────────────────────
    # ESO is installed via Helm, then we create:
    #   ClusterSecretStore — points ESO at AWS Secrets Manager (using IRSA)
    #   ExternalSecret     — tells ESO which secret to sync into K8s
    # ESO then creates and manages "db-secret" automatically — no credentials
    # are fetched or handled by Ansible.

    - name: Add External Secrets Operator Helm repo
      command: helm repo add external-secrets https://charts.external-secrets.io
      changed_when: false

    - name: Update Helm repos
      command: helm repo update
      changed_when: false

    - name: Install External Secrets Operator
      command: >
        helm upgrade --install external-secrets external-secrets/external-secrets
        --namespace external-secrets
        --create-namespace
        --version 0.9.20
        --set serviceAccount.annotations."eks\.amazonaws\.com/role-arn"={{ eso_role_arn }}
        --wait
        --timeout 300s

    - name: Apply ClusterSecretStore (ESO → AWS Secrets Manager bridge)
      kubernetes.core.k8s:
        state: present
        template: templates/cluster-secret-store.yml.j2

    - name: Apply ExternalSecret (creates db-secret K8s Secret via ESO)
      kubernetes.core.k8s:
        state: present
        template: templates/external-secret.yml.j2

    - name: Wait for ESO to sync db-secret
      kubernetes.core.k8s_info:
        kind: Secret
        namespace: default
        name: db-secret
      register: db_secret_info
      until: db_secret_info.resources | length > 0
      retries: 12
      delay: 10

    # ── MySQL ─────────────────────────────────────────────────────────────

    - name: Apply MySQL headless service
      kubernetes.core.k8s:
        state: present
        template: templates/mysql-service.yml.j2

    - name: Apply gp3 StorageClass
      kubernetes.core.k8s:
        state: present
        template: templates/storageclass-gp3.yml.j2

    - name: Apply MySQL StatefulSet
      kubernetes.core.k8s:
        state: present
        template: templates/mysql-statefulset.yml.j2

    - name: Wait for MySQL pod to be ready
      kubernetes.core.k8s_info:
        kind: Pod
        namespace: default
        label_selectors: ["app=mysql"]
        wait: true
        wait_condition:
          type: Ready
          status: "True"
        wait_timeout: 240

    # ── Tomcat app ────────────────────────────────────────────────────────

    - name: Apply Tomcat Deployment
      kubernetes.core.k8s:
        state: present
        template: templates/deployment.yml.j2

    - name: Apply LoadBalancer Service
      kubernetes.core.k8s:
        state: present
        template: templates/service.yml.j2
