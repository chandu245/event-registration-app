- hosts: local
  gather_facts: false
  vars:
    ecr_repo: "{{ ecr_repo_url }}"
    image_tag: "{{ build_number }}"
    aws_region: "{{ aws_region | default('ap-southeast-1') }}"
    secret_name: "{{ aws_secret_name }}"

  pre_tasks:
    - name: Ensure AWS secret name was supplied
      assert:
        that:
          - aws_secret_name is defined
          - aws_secret_name | length > 0
        fail_msg: >
          aws_secret_name must be passed via -e aws_secret_name=<name>.
          Run `terraform output db_secret_name` to get it.

    - name: Fetch DB credentials from AWS Secrets Manager
      # Returns a JSON string; register it for use in the K8s Secret template.
      shell: >
        aws secretsmanager get-secret-value
        --secret-id "{{ secret_name }}"
        --region "{{ aws_region }}"
        --query SecretString
        --output text
      register: secret_json_result
      no_log: true    # suppress credential values from console output

    - name: Parse secret JSON into variables
      set_fact:
        db_secret: "{{ secret_json_result.stdout | from_json }}"
      no_log: true

  tasks:
    - name: Log in to ECR
      shell: >
        aws ecr get-login-password --region {{ aws_region }} |
        docker login --username AWS --password-stdin {{ ecr_repo }}

    - name: Build Docker image
      # Use playbook_dir for an absolute path — the Ansible `command` module
      # does not guarantee that the CWD matches the playbook directory, so a
      # relative `../app` can silently resolve to the wrong location.
      command: docker build -t {{ ecr_repo }}:{{ image_tag }} {{ playbook_dir }}/../app

    - name: Push image to ECR
      command: docker push {{ ecr_repo }}:{{ image_tag }}

    - name: Apply DB Secret (populated from AWS Secrets Manager)
      kubernetes.core.k8s:
        state: present
        template: templates/secret.yml.j2

    - name: Apply MySQL headless service
      kubernetes.core.k8s:
        state: present
        template: templates/mysql-service.yml.j2

    - name: Apply gp3 StorageClass
      kubernetes.core.k8s:
        state: present
        template: templates/storageclass-gp3.yml.j2

    - name: Apply MySQL StatefulSet
      kubernetes.core.k8s:
        state: present
        template: templates/mysql-statefulset.yml.j2

    - name: Wait for MySQL pod to be ready
      kubernetes.core.k8s_info:
        kind: Pod
        namespace: default
        label_selectors: ["app=mysql"]
        wait: true
        wait_condition:
          type: Ready
          status: "True"
        wait_timeout: 180

    - name: Apply Tomcat Deployment
      kubernetes.core.k8s:
        state: present
        template: templates/deployment.yml.j2

    - name: Apply LoadBalancer Service
      kubernetes.core.k8s:
        state: present
        template: templates/service.yml.j2
