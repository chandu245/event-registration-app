# Local development only — NOT used in production.
# Production runs on AWS EKS with credentials from AWS Secrets Manager.
#
# Usage:
#   cp .env.example .env   # then edit .env with real passwords
#   docker compose up -d
#   open http://localhost:8081
services:
  mysql:
    image: mysql:8.0
    env_file: .env
    ports:
      - "3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "--silent"]
      interval: 10s
      timeout: 5s
      retries: 6

  tomcat-app:
    build: ./app
    ports:
      - "8081:8080"
    environment:
      DB_URL: jdbc:mysql://mysql:3306/eventdb
      DB_USER: eventuser
      DB_PASS: ${MYSQL_PASSWORD}
    depends_on:
      mysql:
        condition: service_healthy

volumes:
  mysql-data:
